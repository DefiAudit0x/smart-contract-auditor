name: Smart Contract Audit

on:
  pull_request:
    paths:
      - '**.sol'
      - '**.vy'
      - '**.move'
  push:
    branches: [main, master]
    paths:
      - '**.sol'
      - '**.vy'
      - '**.move'
  workflow_dispatch:
    inputs:
      contract_path:
        description: 'Path to contract file(s)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Find contract files
        id: find
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          CONTRACT_PATH: ${{ inputs.contract_path }}
        run: |
          set -euo pipefail
          : > audit-files.txt
          if [ -n "$CONTRACT_PATH" ] && [ -f "$CONTRACT_PATH" ]; then
            printf '%s\n' "$CONTRACT_PATH" > audit-files.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.sol' '*.vy' '*.move' > audit-files.txt || true
            if [ ! -s audit-files.txt ]; then
              find . -type f \( -name '*.sol' -o -name '*.vy' -o -name '*.move' \) -print | sort | head -5 > audit-files.txt
            fi
          fi
          if [ -s audit-files.txt ]; then
            echo 'has_files=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_files=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run remote audit
        id: audit
        if: steps.find.outputs.has_files == 'true'
        env:
          AUDITOR_API_URL: ${{ secrets.AUDITOR_API_URL }}
          AUDITOR_API_KEY: ${{ secrets.AUDITOR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUDITOR_API_URL:-}" ] || [ -z "${AUDITOR_API_KEY:-}" ]; then
            echo 'Remote audit skipped because AUDITOR_API_URL and AUDITOR_API_KEY are not configured as repository secrets.' >> "$GITHUB_STEP_SUMMARY"
            echo 'ran=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ran=true' >> "$GITHUB_OUTPUT"
          : > audit-report.md
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            payload="$(mktemp)"
            jq -n --rawfile code "$file" '{code: ($code | .[:4000]), type: "audit"}' > "$payload"
            result="$(curl --fail-with-body --silent --show-error --max-time 120 \
              -X POST "${AUDITOR_API_URL%/}/api/analyze/json" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $AUDITOR_API_KEY" \
              --data-binary "@$payload")"
            rm -f "$payload"
            {
              printf '## %s\n' "$file"
              printf '%s\n' "$result" | jq -r '.report // .result // .error // "Unknown"'
              printf '\n'
            } >> audit-report.md
          done < audit-files.txt

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && steps.audit.outputs.ran == 'true' && hashFiles('audit-report.md') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.md', 'utf8');
            if (report.trim()) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## Smart Contract Audit Report\n\n' + report.slice(0, 60000)
              });
            }
