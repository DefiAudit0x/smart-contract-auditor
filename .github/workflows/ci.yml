name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.10.14"
  FOUNDRY_VERSION: "v1.7.1"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install --require-hashes -r requirements.lock

      - name: Set up Foundry ${{ env.FOUNDRY_VERSION }}
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install pinned Solidity compiler
        run: python -c "import solcx; solcx.install_solc('0.8.25')"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            __pycache__/
            .pytest_cache/
          retention-days: 7

  benchmark:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install --require-hashes -r requirements.lock

      - name: Set up Foundry ${{ env.FOUNDRY_VERSION }}
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install pinned Solidity compiler
        run: python -c "import solcx; solcx.install_solc('0.8.25')"

      - name: Run strict benchmark
        run: PYTHONPATH=. python benchmarks/run_benchmark.py --require-poc

  lint:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install ruff==0.8.6

      - name: Run ruff on hardened paths
        run: ruff check security_utils.py tests/test_security_hardening.py

  build-docker:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: [test, benchmark]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/auditor-bot:latest
            ${{ secrets.DOCKER_USERNAME }}/auditor-bot:${{ github.sha }}
