name: Periodic Maintenance

# Weekly security & health maintenance:
#   1. Dependency vulnerability scan (pip-audit) against the locked env
#   2. Static security scan (bandit) over production code
#   3. Full test suite in the exact CI environment (gate)
# Scanners are report-only (findings land in the job summary and artifacts);
# the test suite is the blocking gate. Run manually any time via dispatch.

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 4 * * 1" # every Monday 04:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10.14"
  FOUNDRY_VERSION: "v1.7.1"
  PIP_AUDIT_VERSION: "2.7.3"
  BANDIT_VERSION: "1.8.0"

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-maint-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install locked environment + scanners
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install --require-hashes -r requirements.lock
          pip install "pip-audit==${{ env.PIP_AUDIT_VERSION }}" "bandit==${{ env.BANDIT_VERSION }}"

      - name: Dependency vulnerability audit (pip-audit)
        continue-on-error: true
        run: |
          echo "## Dependency vulnerabilities (pip-audit)" >> "$GITHUB_STEP_SUMMARY"
          pip-audit --require-hashes -r requirements.lock \
            --format markdown --output pip-audit-report.md || true
          if [ -s pip-audit-report.md ]; then
            cat pip-audit-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No known vulnerabilities found in locked dependencies." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Static security scan (bandit)
        continue-on-error: true
        run: |
          echo "## Static security findings (bandit, medium+)" >> "$GITHUB_STEP_SUMMARY"
          bandit -r . \
            --exclude ./tests,./benchmarks,./venv*,./.git,./node_modules \
            --severity-level medium \
            --format custom --msg-template "{abspath}:{line}: [{test_id}] {msg}" \
            --output bandit-report.txt || true
          if [ -s bandit-report.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -100 bandit-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "(full report in artifacts; first 100 lines shown)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No medium+ severity findings." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            pip-audit-report.md
            bandit-report.txt
          if-no-files-found: ignore
          retention-days: 30

  maintenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install --require-hashes -r requirements.lock

      - name: Set up Foundry ${{ env.FOUNDRY_VERSION }}
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install pinned Solidity compilers
        run: |
          SOLCX_DIR="$(python -c "import solcx; print(solcx.get_solcx_install_folder())")"
          mkdir -p "$SOLCX_DIR"
          curl --fail --location --silent --show-error \
            "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.4.10+commit.9e8cc01b" \
            --output "$SOLCX_DIR/solc-v0.4.10"
          echo "f3638225df24f444a72123956033f5743079118f0e1195ce6969aa16a7ef2283  $SOLCX_DIR/solc-v0.4.10" | sha256sum --check --status
          chmod +x "$SOLCX_DIR/solc-v0.4.10"
          python -c "import solcx; solcx.install_solc('0.8.25'); print(solcx.get_installed_solc_versions())"

      - name: Run full test suite (gate)
        run: python -m pytest tests/ -q --tb=short

      - name: Compile Python modules
        run: python -m compileall -q .
